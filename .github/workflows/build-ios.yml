name: Build iOS (AIM-X Controller)

on:
  push:
    branches: [ main, master ]
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned app (Release, device slice)
        run: |
          set -e
          xcodebuild \
            -project ios/AIMXController.xcodeproj \
            -scheme AIMXController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Archive for later signing
        run: |
          set -e
          xcodebuild \
            -project ios/AIMXController.xcodeproj \
            -scheme AIMXController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            -archivePath ios/build/AIMXController.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Verify built app exists
        run: |
          set -e
          test -d ios/build/AIMXController.xcarchive/Products/Applications/AIMXController.app
          echo "OK: built .app is present"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMXController-unsigned
          path: |
            ios/build/AIMXController.xcarchive/Products/Applications/AIMXController.app
            ios/build/AIMXController.xcarchive
          if-no-files-found: error
