name: Build iOS (AIM-X Controller)

# Builds the AIM-X iOS controller on a free macOS runner and uploads the
# resulting .ipa + .app as workflow artifacts. You do NOT need a Mac of your
# own: GitHub hosts the macOS machine for you. The build is unsigned
# (CODE_SIGNING_ALLOWED=NO), so you sideload it with Sideloadly / AltStore /
# your own Developer cert afterwards.
#
# Real-device note: the controller talks to the cheat PC over local network
# (TCP 1212 / UDP 1213), which requires a real iPhone/iPad — the iOS
# Simulator cannot do per-interface local networking. The .ipa produced here
# is meant for physical-device sideloading.

on:
  push:
    branches: [ main, master ]
    paths:
      - "ios/**"
  workflow_dispatch:   # allow manual "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: macos-14   # macOS 14 w/ Xcode 15.x, ram 7 GB, free for public/OSS
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve instance ID (needed to snapshot for signing later if you add secrets)
        run: echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Show used Xcode SDK
        run: xcodebuild -showsdks | grep -i iphoneos

      - name: Build unsigned .app (Release, device slice)
        run: |
          xcodebuild \
            -project ios/AIMXController.xcodeproj \
            -scheme AIMXController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa via xcodebuild archive + export
        run: |
          set -e
          mkdir -p ios/ipa/export
          cat > ios/ipa/exportOptions.plist <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>development</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>signingCertificate</key>
  <string>-</string>
  <key>stripSwiftSymbols</key>
  <true/>
</dict>
</plist>
EOF
          xcodebuild \
            -project ios/AIMXController.xcodeproj \
            -scheme AIMXController \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            -archivePath ios/build/AIMXController.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMXController-unsigned
          path: |
            ios/build/AIMXController.xcarchive/Products/Applications/AIMXController.app
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Build finished" 
          echo "- Artifact \`AIMXController-unsigned\` carries the built \`.app\` and \`.xcarchive\`."
          echo "- Sideload with Sideloadly/AltStore (bring your own Apple ID), or sign in Xcode with your team."
          echo "  - The full archive is at \`ios/build/AIMXController.xcarchive\` for signing with a \`development\` profile."
